# Hand-edited EESSI software curation manifest for scigetorg/apps-catalog.
#
# Each entry maps an EasyBuild package name in EESSI's metadata feed
# (eessi_api_metadata_software.json) to one or more configured domains,
# categories, and safe argv launchers.
#
# By default, consolidation selects the newest CPU build of each package in a
# domain's configured eessi_stacks. Set `gpu: optional` to emit both the newest
# CPU and newest GPU build, `gpu: only` for GPU-only builds, `version_pattern`
# to constrain versions by regex, or `pin` (string or per-stack map) to lock an
# exact module name.

schemaVersion: 1
sourceUrl: https://www.eessi.io/api_data/data/eessi_api_metadata_software.json
cvmfsRepo: software.eessi.io

packages:
  ParaView:
    id: paraview
    domains:
      - neuroimaging
      - microscopy
      - datascience
      - preclinical
      - molecular-imaging
      - dermatology
    categories:
      - visualization
    launchers:
      - name: ParaView
        exec: [paraview]
        gui: true
        show_in_menu: true
        show_in_applist: true

