name: Consolidate apps catalog

on:
  push:
    branches: [main]
    paths: [domains.json, eessi/curation.yaml]
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    concurrency:
      group: apps-catalog-prepare
      queue: max
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      regenerate: ${{ steps.mode.outputs.regenerate }}
    steps:
      - name: Check out catalog
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Decide whether to regenerate
        id: mode
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          regenerate=true
          regenerate_eessi=true
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            regenerate=$(node scripts/workflow.mjs needs-consolidation)
            regenerate_eessi=$(node scripts/workflow.mjs needs-eessi)
            if [[ "$regenerate_eessi" != "true" ]]; then
              if [[ -n "$EVENT_BEFORE" && "$EVENT_BEFORE" != 0000000000000000000000000000000000000000 ]] \
                 && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
                curation_changed=$(git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" -- eessi/curation.yaml)
              else
                curation_changed=$(git show --name-only --format= HEAD -- eessi/curation.yaml)
              fi
              if [[ -n "$curation_changed" ]]; then
                regenerate_eessi=true
              fi
            fi
          fi
          echo "regenerate=$regenerate" >> "$GITHUB_OUTPUT"
          echo "regenerate_eessi=$regenerate_eessi" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v6
        if: steps.mode.outputs.regenerate == 'true'
        with:
          python-version: '3.11'
      # jinja2 and attrs run neurocontainers' tools/generate_apps_json.py,
      # which supplies tool citations and descriptions.
      - name: Install license lookup and source generator dependencies
        if: steps.mode.outputs.regenerate == 'true'
        run: python -m pip install requests 'pyyaml>=6.0.2' packaging jinja2 attrs
      - name: Check out configured containers repositories
        if: steps.mode.outputs.regenerate == 'true'
        run: node scripts/workflow.mjs checkout
      - name: Consolidate every domain and recipe licenses
        if: steps.mode.outputs.regenerate == 'true'
        env:
          ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
        run: npm run consolidate
      # Public Zenodo API (no token, ~5 requests). A failure keeps the committed
      # list and must not block the catalog update.
      - name: Refresh Zenodo license list
        if: steps.mode.outputs.regenerate == 'true'
        continue-on-error: true
        run: python -m scripts.zenodo_licenses --output licenses/zenodo.json
      # Public EESSI metadata feed. Push events run strictly so curation or
      # stack changes fail fast in prepare; scheduled/manual runs fail softly
      # on upstream feed outages (keeping committed eessi.json files).
      - name: Refresh EESSI software catalogs
        if: steps.mode.outputs.regenerate_eessi == 'true'
        run: |
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            node scripts/workflow.mjs eessi
          else
            node scripts/workflow.mjs eessi --fail-soft
          fi
      - name: Commit domain catalog files
        if: steps.mode.outputs.regenerate == 'true' || steps.mode.outputs.regenerate_eessi == 'true'
        shell: bash
        env:
          REGENERATE: ${{ steps.mode.outputs.regenerate }}
        run: |
          paths="$(node scripts/workflow.mjs output-paths)"
          while IFS= read -r path; do
            [[ -z "$path" ]] && continue
            if [[ "$path" == */apps.json || "$path" == */manifest.json ]]; then
              git add -- "$path"
            elif [[ -e "$path" ]]; then
              git add -- "$path"
            fi
          done <<< "$paths"
          [[ -e licenses/zenodo.json ]] && git add -- licenses/zenodo.json
          if git diff --cached --quiet; then
            echo 'No catalog changes to commit'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if [[ "$REGENERATE" == "true" ]]; then
            git commit -m 'Update domain apps catalogs from container releases'
          else
            git commit -m 'Update EESSI software catalogs'
          fi
          git push origin HEAD:main
      - name: Record prepared revision
        id: revision
        run: |
          sha=$(git rev-parse HEAD)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

  deploy:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: apps-catalog
      queue: max
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare.outputs.sha }}
      # A delayed job or a retry may hold an older catalog. Compare deploy inputs
      # under the deploy lock so unrelated commits on main still allow publication.
      - name: Check for a superseding catalog
        id: current
        run: |
          git fetch --no-tags --depth=1 origin main
          changed=$(git diff --name-only HEAD FETCH_HEAD -- \
            domains.json eessi/curation.yaml ':(glob)*/apps.json' ':(glob)*/eessi.json' \
            eessi/catalog.json licenses/zenodo.json \
            scripts/{cloudflare,domains,eessi,workflow,catalog}.mjs package.json package-lock.json)
          if [[ -n "$changed" ]]; then
            echo "Skipping superseded deployment. Changed on main:"
            echo "$changed"
          else
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@v4
        if: steps.current.outputs.publish == 'true'
        with:
          node-version: '24.0.0'
          cache: npm
      - run: npm ci
        if: steps.current.outputs.publish == 'true'
      - name: Publish apps catalogs to Cloudflare
        if: steps.current.outputs.publish == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: npm run publish:cloudflare

  dois:
    needs: prepare
    if: needs.prepare.outputs.regenerate == 'true'
    uses: ./.github/workflows/publish-dois.yml
    with:
      catalog_sha: ${{ needs.prepare.outputs.sha }}
    secrets:
      ZENODO_TOKEN: ${{ secrets.ZENODO_TOKEN }}
