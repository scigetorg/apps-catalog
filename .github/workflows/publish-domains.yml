name: Publish domains

# domains.json is edited by hand. Neurodesk App reads each domain's container
# block from it, so publish it as soon as it lands on main instead of waiting
# for the nightly consolidate run. A deploy replaces every
# asset, so this republishes the committed apps catalogs and license list too;
# that is the same set consolidate's last step publishes.
#
# No pull_request trigger: this job holds the Cloudflare token. PRs that touch
# domains.json are validated by test.yml.

on:
  push:
    branches: [ main ]
    paths:
      - 'domains.json'
  workflow_dispatch: {}

concurrency:
  group: apps-catalog
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      # Check out main, not the triggering commit: this run may wait behind a
      # consolidate run that pushed newer catalogs, and a deploy must never
      # replace them with older ones.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'
          cache: npm
      - run: npm ci
      - name: Validate domains.json
        run: npm run validate:domains
      - name: Publish to Cloudflare
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_WORKER_NAME: ${{ vars.CLOUDFLARE_WORKER_NAME }}
        run: npm run publish:cloudflare
